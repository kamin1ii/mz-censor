name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Windows only, deliberately. The app drives alice.exe and ships as a
# Windows exe, so a green build on another platform would not mean much.
# This mirrors build.ps1 step for step, so a CI failure is reproducible
# locally with one command.
jobs:
  build:
    runs-on: windows-latest
    permissions:
      # This repo's default workflow token is read only, so attaching the
      # exe to a release needs the write granted explicitly. Scoped to the
      # job rather than widening the repository default.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Run tests
        # The suite needs no display and no alice.exe. conftest.py sets
        # this itself, repeated here so a headless failure is obviously
        # about the display rather than about Qt.
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q

      - name: Build the exe
        run: pyinstaller --noconfirm --clean mz-censor.spec

      - name: Verify the exe starts
        # A build can succeed and still produce an exe that dies on
        # launch, which is what an over-eager exclusion in the spec looks
        # like. The app has no batch mode, so surviving its first seconds
        # in the event loop is the pass condition.
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process .\dist\MZCensor.exe -ArgumentList "--smoke-test" -PassThru -Wait -WindowStyle Hidden
          if ($p.ExitCode -ne 0) { throw "MZ Censor startup self-test failed" }
          $mb = (Get-Item .\dist\MZCensor.exe).Length / 1MB
          Write-Host ("exe is {0:N1} MB" -f $mb)
          # A sudden jump means an exclusion in the spec stopped matching,
          # usually because a Qt release renamed something. The ceiling was
          # 60 MB and let a 4.6 MB regression through, so it now sits just
          # above a normal build of about 28 MB.
          if ($mb -gt 60) { throw ("exe is {0:N1} MB, larger than expected" -f $mb) }

      - name: Check no OpenSSL crept in
        # This runner has OpenSSL on its PATH and a development machine
        # usually does not, so PyInstaller resolves a dependency here that
        # it cannot resolve locally. That asymmetry shipped 2.6 MB of Qt's
        # OpenSSL in v0.7.0 supporting a DLL that is not even in the exe.
        shell: pwsh
        run: |
          python -c @"
          from PyInstaller.archive.readers import CArchiveReader
          names = [str(k).replace(chr(92), '/').lower() for k in CArchiveReader('dist/MZCensor.exe').toc]
          found = sorted(n for n in names if 'libcrypto' in n or 'libssl' in n)
          if found:
              raise SystemExit('the exe is carrying ' + ', '.join(found) + ', which nothing uses')
          print('none, as expected')
          "@

      - name: Write a checksum
        # The exe is unsigned, so this is the only way a downloader can
        # confirm the file arrived intact.
        shell: pwsh
        run: |
          $h = (Get-FileHash .\dist\MZCensor.exe -Algorithm SHA256).Hash
          Set-Content .\dist\MZCensor.exe.sha256 "$h *MZCensor.exe" -Encoding ascii
          Write-Host $h

      - uses: actions/upload-artifact@v4
        with:
          name: MZCensor-exe
          path: |
            dist/MZCensor.exe
            dist/MZCensor.exe.sha256
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/MZCensor.exe
            dist/MZCensor.exe.sha256
