[project]
name = "mz-censor"
version = "0.1.0"
description = "Non-destructive image censor editor for RPG Maker MV/MZ and supported packed demos."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
    "evbunpack==0.2.4",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
mz-censor = "rpg_censor.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alice_censor*", "rpg_censor*"]

[tool.setuptools.package-data]
rpg_censor = ["*.js"]
alice_censor = ["assets/*.ico", "assets/*.png"]
