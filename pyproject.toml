[project]
name = "alice-censor"
version = "0.7.0"
description = "Desktop app for censoring CG images extracted from AliceSoft visual novels via alice-tools."
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
dependencies = [
    "PySide6>=6.6",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
alice-censor = "alice_censor.gui.app:run"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["alice_censor*"]
